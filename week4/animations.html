<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Two simple loading indicators to practice CSS animations and transitions.">
  <meta name="author" content="Jose Ezequiel Flores Menendez">
  <title>CSS Animations and Transitions</title>
  <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
  <main>
    <h1>CSS Animations and Transitions</h1>
    <section>
      <h2>Animation</h2>
      <p>The ring spins while the gear grows and shrinks.</p>
      <input type="checkbox" id="pause-animation">
      <label for="pause-animation">Pause animation</label>
      <div class="loader" aria-hidden="true"></div>
      <p>Loading... (animation example)</p>
    </section>
    <section>
      <h2>Transition</h2>
      <p>Hover over the ring or focus it using the Tab key.</p>
      <div class="loader-t" role="img" tabindex="0" aria-label="Loading indicator transition example"></div>
      <p>The ring rotates once and the gear appears.</p>
    </section>
  </main>
  <footer>
    <p>Jose Ezequiel Flores Menendez | WDD 231</p>
  </footer>
</body>
</html>
